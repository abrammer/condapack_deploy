name: pack and upload release 

on:
  push:
    # Sequence of patterns matched against refs/tags
    tags:
    - 'v*' # Push events to matching v*, i.e. v1.0, v20.15.10


jobs:
  build:

    runs-on: macos-latest

    steps:
      - uses: actions/checkout@v2
      - uses: goanpeca/setup-miniconda@v1.0.2
        with:
          activate-environment: conda_pack_env
          environment-file: env.yml
          auto-activate-base: false
      - name: Install Repo Code into Environment
        shell: bash -l {0}
        run: |
          pip install conda-pack
          pip install .
          conda-pack -o condapack_deploy_macos_py37.tar.gz
      - name: Upload artifact
        uses: actions/upload-artifact@v1.0.0
        with:
          # Artifact name
          name: macos_py37_condapack_deploy
          # Directory containing files to upload
          path: ./condapack_deploy_macos_py37.tar.gz
      - name: Create Release
        id: create_release
        uses: actions/create-release@v1.0.0
        with:
          tag_name: ${{ github.ref }}
          release_name: Release ${{ github.ref }}
          draft: false
          prerelease: false
      - name: Upload Release Asset
        id: upload-release-asset 
        uses: actions/upload-release-asset@v1.0.1
        with:
          upload_url: ${{ steps.create_release.outputs.upload_url }} # This pulls from the CREATE RELEASE step above, referencing it's ID to get its outputs object, which include a `upload_url`. See this blog post for more info: https://jasonet.co/posts/new-features-of-github-actions/#passing-data-to-future-steps 
          asset_path: ./condapack_deploy_macos_py37.tar.gz
          asset_name: condapack_deploy_macos_py37.tar.gz
          asset_content_type: application/zip
